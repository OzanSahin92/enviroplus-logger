[tool.poetry]
name = "enviroplus-logger"
version = "0.2.0"
description = "Secure edge-to-cloud telemetry pipeline for Enviro+ hardware"
authors = ["Ozan Sahin", "Hakan Kirdas"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
aws-cdk-lib = "2.122.0"

[tool.poetry.group.dev.dependencies]
jupyterlab = "^4.0.9"
black = "^23.12.1"
pylint = "^3.0.3"
ruff = "^0.6.9"
pytest = "^7.4.4"
pytest-mock = "^3.12.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
